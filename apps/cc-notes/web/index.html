<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes · CoolCloud</title>
    <link rel="stylesheet" href="/vendor/fa/css/all.min.css" />
    <link rel="stylesheet" href="/vendor/fonts/inter.css" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <style>
      body { background: var(--bg); }
      .app { display: grid; grid-template-columns: 268px 1fr; min-height: 100vh; }
      .rail { border-right: 1px solid var(--border); background: var(--surface); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
      .rail .brand { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 15px; }
      .rail .brand i { color: var(--app-notes, var(--accent)); }
      .notes-list { display: flex; flex-direction: column; gap: 3px; overflow: auto; }
      .note-row { border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 9px; cursor: pointer; font: inherit; color: var(--text-2); }
      .note-row:hover { background: var(--surface-3); }
      .note-row[aria-current='true'] { background: var(--accent-soft); color: var(--accent); }
      .note-row b { display: block; font-size: 12.5px; font-weight: 600; }
      .note-row span { font-size: 11px; opacity: 0.75; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .pane { padding: 20px 24px 30px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
      .meta-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .meta-row input.title { flex: 1; min-width: 160px; font-size: 18px; font-weight: 650; border: 0; background: transparent; padding: 4px 0; color: var(--text); }
      .meta-row input.title:focus { outline: none; border-bottom: 2px solid var(--accent); }
      .split { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; flex: 1; min-height: 0; }
      .split textarea { min-height: 420px; resize: vertical; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.7; }
      .preview { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); padding: 16px 18px; overflow: auto; font-size: 13px; line-height: 1.65; }
      .preview h1, .preview h2, .preview h3 { margin: 0.8em 0 0.4em; letter-spacing: -0.01em; }
      .preview h1 { font-size: 20px; } .preview h2 { font-size: 17px; } .preview h3 { font-size: 14.5px; }
      .preview p { margin: 0 0 0.7em; }
      .preview code { background: var(--surface-3); padding: 1px 5px; border-radius: 4px; font-family: var(--font-mono); font-size: 0.92em; }
      .preview pre { background: var(--surface-3); padding: 10px 12px; border-radius: 8px; overflow: auto; }
      .preview blockquote { border-left: 3px solid var(--accent-line); margin: 0 0 0.7em; padding-left: 12px; color: var(--text-2); }
      .preview a { color: var(--accent); }
      .preview ul { margin: 0 0 0.7em; padding-left: 20px; }
      .toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 90; }
      .toast { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--ok); border-radius: 10px; padding: 10px 13px; font-size: 12.5px; box-shadow: 0 10px 30px rgba(9, 30, 52, 0.16); }
      .toast.bad { border-left-color: var(--danger); }
      .empty-state { text-align: center; padding: 40px 10px; color: var(--text-3); }
      .empty-state i { font-size: 26px; display: block; margin-bottom: 10px; opacity: 0.6; }
      .empty-state p { margin: 0 0 12px; font-size: 13px; }
      @media (max-width: 820px) { .app { grid-template-columns: 1fr; } .rail { border-right: 0; border-bottom: 1px solid var(--border); max-height: 220px; } .split { grid-template-columns: 1fr; } .split textarea { min-height: 240px; } }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="rail">
        <div class="brand"><i class="fa-solid fa-note-sticky"></i> Notes</div>
        <button class="btn primary sm" id="new-note"><i class="fa-solid fa-plus"></i> New note</button>
        <input class="input" id="search" placeholder="Search notes..." aria-label="Search notes" />
        <div class="notes-list" id="notes"></div>
      </aside>
      <main class="pane" id="pane">
        <div class="empty-state" style="margin:auto"><i class="fa-solid fa-spinner fa-spin"></i><p>Opening your notes…</p></div>
      </main>
    </div>
    <div class="toasts" id="toast-root"></div>

    <script type="module">
      const APP = 'cc:notes';
      const $ = (sel, root = document) => root.querySelector(sel);
      const esc = (value) =>
        String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
      const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      const when = (iso) => {
        const date = new Date(iso);
        return Number.isNaN(date.getTime()) ? '' : date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      };

      try {
        document.documentElement.dataset.theme = window.parent.document.documentElement.dataset.theme || 'light';
      } catch {
        /* standalone */
      }

      let db = { notes: [] };
      let current = '';
      let query = '';
      let timer = null;

      async function api(path, { method = 'GET', body } = {}) {
        const init = { method, credentials: 'same-origin', headers: {} };
        if (body !== undefined) {
          init.headers['Content-Type'] = 'application/json';
          init.body = JSON.stringify(body);
        }
        const response = await fetch(path, init);
        let data = null;
        try {
          data = await response.json();
        } catch {
          data = null;
        }
        if (!response.ok) {
          const error = new Error(data?.error || `Request failed (${response.status})`);
          error.status = response.status;
          throw error;
        }
        return data || {};
      }

      function toast(message, bad = false) {
        const node = document.createElement('div');
        node.className = `toast${bad ? ' bad' : ''}`;
        node.textContent = message;
        $('#toast-root').appendChild(node);
        setTimeout(() => node.remove(), bad ? 6000 : 3000);
      }

      async function load() {
        try {
          const data = await api(`/api/apps/${APP}/storage`);
          const saved = JSON.parse(data.data?.state || '{}');
          db = { notes: Array.isArray(saved.notes) ? saved.notes : [] };
          if (!db.notes.some((note) => note.id === current)) current = db.notes[0]?.id || '';
          renderList();
          renderPane();
        } catch (error) {
          if (error.status === 403) return renderConsent();
          toast(error.message, true);
        }
      }

      async function save() {
        await api(`/api/apps/${APP}/storage`, { method: 'PUT', body: { key: 'state', value: JSON.stringify(db) } });
      }

      function renderConsent() {
        $('#pane').innerHTML = `<div class="card empty-state" style="margin:auto">
          <i class="fa-solid fa-shield-halved"></i>
          <p>Notes keeps your writing in your CoolCloud account. Allow storage once to start.</p>
          <button class="btn primary sm" id="grant"><i class="fa-solid fa-check"></i> Allow storage</button>
        </div>`;
        $('#grant').addEventListener('click', async () => {
          try {
            await api(`/api/apps/${APP}/grants`, { method: 'POST', body: { scopes: ['storage'] } });
            await load();
          } catch (error) {
            toast(error.message, true);
          }
        });
      }

      // A small Markdown renderer: headings, lists, quotes, code, bold, italic and links.
      function markdown(text) {
        const blocks = String(text || '').replace(/\r\n/g, '\n').split(/\n{2,}/);
        const inline = (value) =>
          esc(value)
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
            .replace(/\*([^*]+)\*/g, '<em>$1</em>')
            .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
        return blocks
          .map((block) => {
            const lines = block.split('\n');
            if (block.startsWith('```')) {
              const body = lines.slice(1).filter((line) => !line.startsWith('```')).join('\n');
              return `<pre><code>${esc(body)}</code></pre>`;
            }
            if (/^#{1,3} /.test(block)) {
              const level = block.match(/^#+/)[0].length;
              return `<h${level}>${inline(block.replace(/^#+ /, ''))}</h${level}>`;
            }
            if (lines.every((line) => /^[-*] /.test(line))) {
              return `<ul>${lines.map((line) => `<li>${inline(line.slice(2))}</li>`).join('')}</ul>`;
            }
            if (lines.every((line) => /^&gt;|^> /.test(line))) {
              return `<blockquote>${inline(lines.map((line) => line.replace(/^&gt; |^> /, '')).join(' '))}</blockquote>`;
            }
            return `<p>${inline(block).replace(/\n/g, '<br />')}</p>`;
          })
          .join('');
      }

      function renderList() {
        const list = db.notes
          .filter((note) => !query || `${note.title} ${note.body}`.toLowerCase().includes(query))
          .sort((a, b) => String(b.updated || '').localeCompare(String(a.updated || '')));
        $('#notes').innerHTML = list.length
          ? list
              .map(
                (note) => `<button class="note-row" data-note="${esc(note.id)}" aria-current="${String(note.id === current)}">
                  <b>${esc(note.title || 'Untitled note')}</b>
                  <span>${esc(String(note.body || '').replace(/[#*`>]/g, '').slice(0, 60) || 'Empty note')} · ${esc(when(note.updated))}</span>
                </button>`
              )
              .join('')
          : `<p class="hint" style="padding:8px">No notes yet.</p>`;
        $('#notes').querySelectorAll('[data-note]').forEach((node) =>
          node.addEventListener('click', () => {
            current = node.dataset.note;
            renderList();
            renderPane();
          })
        );
      }

      function renderPane() {
        const note = db.notes.find((item) => item.id === current);
        if (!note) {
          $('#pane').innerHTML = `<div class="card empty-state" style="margin:auto"><i class="fa-solid fa-note-sticky"></i><p>Nothing open. Start a note; it saves as you type.</p><button class="btn primary sm" data-new-note>New note</button></div>`;
          $('#pane').querySelector('[data-new-note]').addEventListener('click', () => createNote());
          return;
        }
        $('#pane').innerHTML = `
          <div class="meta-row">
            <input class="title" id="note-title" value="${esc(note.title)}" placeholder="Untitled note" aria-label="Note title" />
            <button class="btn ghost sm" id="delete-note" aria-label="Delete note"><i class="fa-solid fa-trash-can"></i></button>
          </div>
          <p class="tiny dim" style="margin:0">Edited ${esc(when(note.updated))} · Markdown supported · saved automatically</p>
          <div class="split">
            <textarea class="input" id="note-body" spellcheck="true" placeholder="# A heading&#10;&#10;Write anything. **Bold**, *italic*, \`code\`, lists and links all work.">${esc(note.body)}</textarea>
            <div class="preview" id="preview"></div>
          </div>`;

        const title = $('#note-title');
        const body = $('#note-body');
        const preview = $('#preview');
        const paint = () => {
          preview.innerHTML = markdown(body.value);
        };
        const touch = () => {
          note.title = title.value;
          note.body = body.value;
          note.updated = new Date().toISOString();
          paint();
          clearTimeout(timer);
          timer = setTimeout(async () => {
            try {
              await save();
              renderList();
            } catch (error) {
              toast(error.message, true);
            }
          }, 700);
        };
        title.addEventListener('input', touch);
        body.addEventListener('input', touch);
        $('#delete-note').addEventListener('click', async () => {
          if (!confirm('Delete this note?')) return;
          db.notes = db.notes.filter((item) => item.id !== note.id);
          current = db.notes[0]?.id || '';
          await save();
          renderList();
          renderPane();
          toast('Note deleted');
        });
        paint();
      }

      async function createNote() {
        const note = { id: uid(), title: 'Untitled note', body: '', updated: new Date().toISOString() };
        db.notes.push(note);
        current = note.id;
        await save();
        renderList();
        renderPane();
        $('#note-title')?.select();
      }

      $('#new-note').addEventListener('click', () => createNote());
      $('#search').addEventListener('input', (event) => {
        query = event.target.value.trim().toLowerCase();
        renderList();
      });
      load();
    </script>
  </body>
</html>
