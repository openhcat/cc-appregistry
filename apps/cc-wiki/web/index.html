<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wiki · CoolCloud</title>
    <link rel="stylesheet" href="/vendor/fa/css/all.min.css" />
    <link rel="stylesheet" href="/vendor/fonts/inter.css" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <style>
      body { background: var(--bg); }
      .app { display: grid; grid-template-columns: 278px 1fr; min-height: 100vh; }
      .rail { border-right: 1px solid var(--border); background: var(--surface); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
      .rail .brand { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 15px; }
      .rail .brand i { color: var(--app-editor, var(--accent)); }
      .pages { display: flex; flex-direction: column; gap: 3px; overflow: auto; }
      .page-row { border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 9px; cursor: pointer; font: inherit; color: var(--text-2); }
      .page-row:hover { background: var(--surface-3); }
      .page-row[aria-current='true'] { background: var(--accent-soft); color: var(--accent); }
      .page-row b { display: block; font-size: 12.5px; font-weight: 600; }
      .page-row span { font-size: 11px; opacity: 0.75; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .pane { padding: 18px 22px 28px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
      .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .meta .title { flex: 1; min-width: 160px; font-size: 18px; font-weight: 650; border: 0; background: transparent; padding: 4px 0; color: var(--text); }
      .meta .title:focus { outline: none; border-bottom: 2px solid var(--accent); }
      .split { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; flex: 1; min-height: 0; }
      .split textarea { min-height: 440px; resize: vertical; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.7; }
      .preview { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); padding: 16px 18px; overflow: auto; font-size: 13px; line-height: 1.65; }
      .preview h1, .preview h2, .preview h3 { margin: 0.8em 0 0.4em; letter-spacing: -0.01em; }
      .preview h1 { font-size: 20px; } .preview h2 { font-size: 17px; } .preview h3 { font-size: 14.5px; }
      .preview p { margin: 0 0 0.7em; }
      .preview code { background: var(--surface-3); padding: 1px 5px; border-radius: 4px; font-family: var(--font-mono); font-size: 0.92em; }
      .preview pre { background: var(--surface-3); padding: 10px 12px; border-radius: 8px; overflow: auto; }
      .preview blockquote { border-left: 3px solid var(--accent-line); margin: 0 0 0.7em; padding-left: 12px; color: var(--text-2); }
      .preview a { color: var(--accent); }
      .preview ul { margin: 0 0 0.7em; padding-left: 20px; }
      .empty-state { text-align: center; padding: 42px 12px; color: var(--text-3); }
      .empty-state i { font-size: 26px; display: block; margin-bottom: 10px; opacity: 0.6; }
      .empty-state p { margin: 0 0 12px; font-size: 13px; }
      .toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 90; }
      .toast { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--ok); border-radius: 10px; padding: 10px 13px; font-size: 12.5px; box-shadow: 0 10px 30px rgba(9, 30, 52, 0.16); }
      .toast.bad { border-left-color: var(--danger); }
      @media (max-width: 820px) { .app { grid-template-columns: 1fr; } .rail { border-right: 0; border-bottom: 1px solid var(--border); max-height: 220px; } .split { grid-template-columns: 1fr; } .split textarea { min-height: 240px; } }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="rail">
        <div class="brand"><i class="fa-solid fa-book-open"></i> Wiki</div>
        <button class="btn primary sm" id="new-page"><i class="fa-solid fa-plus"></i> New page</button>
        <input class="input" id="search" placeholder="Search pages..." aria-label="Search pages" />
        <div class="pages" id="pages"></div>
        <span class="grow"></span>
        <p class="hint" style="margin:0"><i class="fa-solid fa-folder-tree"></i> Pages live in Files/Wiki</p>
      </aside>
      <main class="pane" id="pane"></main>
    </div>
    <div class="toasts" id="toast-root"></div>
    <script type="module">
      const FOLDER = 'Wiki';
      const $ = (sel, root = document) => root.querySelector(sel);
      const esc = (value) =>
        String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));

      try {
        document.documentElement.dataset.theme = window.parent.document.documentElement.dataset.theme || 'light';
      } catch {
        /* standalone */
      }

      let pages = [];
      let current = '';
      let body = '';
      let query = '';
      let dirty = false;
      let timer = null;

      async function api(path, { method = 'GET', body } = {}) {
        const init = { method, credentials: 'same-origin', headers: {} };
        if (body !== undefined) {
          init.headers['Content-Type'] = 'application/json';
          init.body = JSON.stringify(body);
        }
        const response = await fetch(path, init);
        let data = null;
        try {
          data = await response.json();
        } catch {
          data = null;
        }
        if (!response.ok) {
          const error = new Error(data?.error || `Request failed (${response.status})`);
          error.status = response.status;
          throw error;
        }
        return data || {};
      }

      function toast(message, bad = false) {
        const node = document.createElement('div');
        node.className = `toast${bad ? ' bad' : ''}`;
        node.textContent = message;
        $('#toast-root').appendChild(node);
        setTimeout(() => node.remove(), bad ? 6000 : 3000);
      }

      async function list() {
        try {
          const data = await api(`/api/files?path=${encodeURIComponent(FOLDER)}`);
          pages = data.entries
            .filter((entry) => !entry.dir && entry.name.toLowerCase().endsWith('.md'))
            .map((entry) => ({ name: entry.name, title: entry.name.replace(/\.md$/i, ''), mtime: entry.mtime, size: entry.size }))
            .sort((a, b) => a.title.localeCompare(b.title));
        } catch (error) {
          if (error.status === 404) pages = [];
          else return toast(error.message, true);
        }
        if (!pages.some((page) => page.name === current)) current = pages[0]?.name || '';
        renderList();
        await openPage();
      }

      async function openPage() {
        if (!current) {
          body = '';
          renderPane();
          return;
        }
        try {
          const data = await api(`/api/files/text?path=${encodeURIComponent(`${FOLDER}/${current}`)}`);
          body = data.content;
          dirty = false;
          renderPane();
        } catch (error) {
          toast(error.message, true);
        }
      }

      async function savePage() {
        if (!current) return;
        try {
          await api('/api/files/text', { method: 'PUT', body: { path: `${FOLDER}/${current}`, content: body, create: !pages.some((page) => page.name === current) } });
          dirty = false;
          toast('Page saved');
        } catch (error) {
          toast(error.message, true);
        }
      }

      function markdown(text) {
        const blocks = String(text || '').replace(/\r\n/g, '\n').split(/\n{2,}/);
        const inline = (value) =>
          esc(value)
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
            .replace(/\*([^*]+)\*/g, '<em>$1</em>')
            .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
        return blocks
          .map((block) => {
            const lines = block.split('\n');
            if (block.startsWith('```')) {
              const inner = lines.slice(1).filter((line) => !line.startsWith('```')).join('\n');
              return `<pre><code>${esc(inner)}</code></pre>`;
            }
            if (/^#{1,3} /.test(block)) {
              const level = block.match(/^#+/)[0].length;
              return `<h${level}>${inline(block.replace(/^#+ /, ''))}</h${level}>`;
            }
            if (lines.every((line) => /^[-*] /.test(line))) return `<ul>${lines.map((line) => `<li>${inline(line.slice(2))}</li>`).join('')}</ul>`;
            if (lines.every((line) => /^> /.test(line))) return `<blockquote>${inline(lines.map((line) => line.slice(2)).join(' '))}</blockquote>`;
            return `<p>${inline(block).replace(/\n/g, '<br />')}</p>`;
          })
          .join('');
      }

      function renderList() {
        const visible = pages.filter((page) => !query || page.title.toLowerCase().includes(query));
        $('#pages').innerHTML = visible.length
          ? visible
              .map(
                (page) => `<button class="page-row" data-page="${esc(page.name)}" aria-current="${String(page.name === current)}">
                  <b>${esc(page.title)}</b>
                  <span>${esc(new Date(page.mtime).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }))}</span>
                </button>`
              )
              .join('')
          : `<p class="hint" style="padding:8px">${query ? 'No page matches.' : 'No pages yet.'}</p>`;
        $('#pages').querySelectorAll('[data-page]').forEach((node) =>
          node.addEventListener('click', async () => {
            if (dirty) await savePage();
            current = node.dataset.page;
            renderList();
            await openPage();
          })
        );
      }

      function renderPane() {
        if (!current) {
          $('#pane').innerHTML = `<div class="card empty-state" style="margin:auto"><i class="fa-solid fa-book-open"></i><p>The wiki is empty. Create the first page; it is saved as Markdown in Files/Wiki.</p><button class="btn primary sm" data-new>Create a page</button></div>`;
          $('#pane').querySelector('[data-new]').addEventListener('click', newPage);
          return;
        }
        $('#pane').innerHTML = `
          <div class="meta">
            <input class="title" id="title" value="${esc(current.replace(/\.md$/i, ''))}" readonly aria-label="Page title" />
            <span class="badge">${esc(current)}</span>
            <button class="btn ghost sm" id="save" title="Save"><i class="fa-solid fa-floppy-disk"></i> Save</button>
            <button class="btn ghost sm" id="delete" aria-label="Delete page"><i class="fa-solid fa-trash-can"></i></button>
          </div>
          <p class="hint" style="margin:0">Markdown · saved in Files/Wiki · everyone with access to Files sees it</p>
          <div class="split">
            <textarea class="input" id="body" spellcheck="true" placeholder="# Welcome&#10;&#10;Write the page, then switch tabs to preview.">${esc(body)}</textarea>
            <div class="preview" id="preview"></div>
          </div>`;

        const text = $('#body');
        const preview = $('#preview');
        const paint = () => {
          preview.innerHTML = markdown(text.value);
        };
        text.addEventListener('input', () => {
          body = text.value;
          dirty = true;
          paint();
          clearTimeout(timer);
          timer = setTimeout(async () => {
            await savePage();
            list().catch(() => {});
          }, 900);
        });
        $('#save').addEventListener('click', async () => {
          body = text.value;
          await savePage();
          await list();
        });
        $('#delete').addEventListener('click', async () => {
          if (!confirm(`Delete ${current}? It moves to the Files trash.`)) return;
          try {
            await api(`/api/files?path=${encodeURIComponent(`${FOLDER}/${current}`)}`, { method: 'DELETE' });
            current = '';
            await list();
            toast('Page deleted');
          } catch (error) {
            toast(error.message, true);
          }
        });
        paint();
        text.focus();
      }

      async function newPage() {
        const sheet = document.createElement('div');
        sheet.className = 'sheet';
        sheet.style.cssText = 'position:fixed;inset:0;background:rgba(6,18,30,.4);display:flex;align-items:center;justify-content:center;padding:18px;z-index:80';
        sheet.innerHTML = `<div class="sheet-card" style="background:var(--panel-strong);border:1px solid var(--panel-border);border-radius:14px;box-shadow:var(--shadow-md);width:min(420px,100%);padding:18px">
          <h2 style="margin:0 0 12px;font-size:16px">New page</h2>
          <form class="stack-3">
            <div class="field"><label class="label">Title</label><input class="input" name="title" required placeholder="Getting started" /></div>
            <div class="row" style="justify-content:flex-end;gap:8px">
              <button type="button" class="btn ghost" data-cancel>Cancel</button>
              <button type="submit" class="btn primary">Create</button>
            </div>
          </form>
        </div>`;
        document.body.appendChild(sheet);
        const close = () => sheet.remove();
        sheet.addEventListener('click', (event) => {
          if (event.target === sheet) close();
        });
        sheet.querySelector('[data-cancel]').addEventListener('click', close);
        sheet.querySelector('form').addEventListener('submit', async (event) => {
          event.preventDefault();
          const title = new FormData(event.target).get('title').trim();
          if (!title) return;
          const name = `${title.replace(/[\\/:*?"<>|]/g, '-').slice(0, 80)}.md`;
          try {
            try {
              await api('/api/files/folder', { method: 'POST', body: { path: FOLDER } });
            } catch (error) {
              if (error.status !== 409) throw error;
            }
            await api('/api/files/text', { method: 'PUT', body: { path: `${FOLDER}/${name}`, content: `# ${title}\n\n`, create: true } });
            current = name;
            close();
            await list();
            toast('Page created');
          } catch (error) {
            toast(error.message, true);
          }
        });
        sheet.querySelector('input[name="title"]').focus();
      }

      $('#new-page').addEventListener('click', newPage);
      $('#search').addEventListener('input', (event) => {
        query = event.target.value.trim().toLowerCase();
        renderList();
      });
      list();
    </script>
  </body>
</html>
