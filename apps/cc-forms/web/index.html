<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forms · CoolCloud</title>
    <link rel="stylesheet" href="/vendor/fa/css/all.min.css" />
    <link rel="stylesheet" href="/vendor/fonts/inter.css" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <style>
      body { background: var(--bg); }
      .app { display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; }
      .rail { border-right: 1px solid var(--border); background: var(--surface); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
      .rail .brand { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 15px; }
      .rail .brand i { color: var(--app-projects, var(--accent)); }
      .list { display: flex; flex-direction: column; gap: 3px; overflow: auto; }
      .row { border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 9px; cursor: pointer; font: inherit; color: var(--text-2); }
      .row:hover { background: var(--surface-3); }
      .row[aria-current='true'] { background: var(--accent-soft); color: var(--accent); }
      .row b { display: block; font-size: 12.5px; font-weight: 600; }
      .row span { font-size: 11px; opacity: 0.75; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .pane { padding: 20px 24px 34px; min-width: 0; display: flex; flex-direction: column; gap: 14px; max-width: 900px; }
      .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .head h1 { font-size: 19px; margin: 0; letter-spacing: -0.01em; }
      .head p { margin: 2px 0 0; color: var(--text-3); font-size: 12.5px; }
      .card { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); padding: 15px; }
      .card h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-3); }
      .share { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      .share input { flex: 1; min-width: 180px; font-family: var(--font-mono); font-size: 12px; }
      .field-row-app { border: 1px solid var(--border); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; background: var(--bg); }
      .field-row-app .line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .field-row-app .line input.label-in { flex: 1; min-width: 140px; }
      .field-row-app .line select.type-in { width: 130px; }
      .add-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
      .resp { border-top: 1px solid var(--border); padding: 8px 0; font-size: 12px; }
      .resp:first-of-type { border-top: 0; }
      .resp b { display: block; font-size: 12px; }
      .resp span { color: var(--text-3); font-size: 11.5px; }
      .empty-state { text-align: center; padding: 44px 12px; color: var(--text-3); }
      .empty-state i { font-size: 26px; display: block; margin-bottom: 10px; opacity: 0.6; }
      .empty-state p { margin: 0 0 12px; font-size: 13px; }
      .toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 90; }
      .toast { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--ok); border-radius: 10px; padding: 10px 13px; font-size: 12.5px; box-shadow: 0 10px 30px rgba(9, 30, 52, 0.16); }
      .toast.bad { border-left-color: var(--danger); }
      @media (max-width: 820px) { .app { grid-template-columns: 1fr; } .rail { border-right: 0; border-bottom: 1px solid var(--border); max-height: 230px; } }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="rail">
        <div class="brand"><i class="fa-solid fa-clipboard-list"></i> Forms</div>
        <button class="btn primary sm" id="new-form"><i class="fa-solid fa-plus"></i> New form</button>
        <input class="input" id="search" placeholder="Search forms..." aria-label="Search forms" />
        <div class="list" id="list"></div>
        <span class="grow"></span>
        <p class="hint" style="margin:0"><i class="fa-solid fa-link"></i> Share a link, collect answers</p>
      </aside>
      <main class="pane" id="pane"></main>
    </div>
    <div class="toasts" id="toast-root"></div>
    <script type="module">
      const APP = 'cc:forms';
      const TYPES = [
        ['text', 'Short text'],
        ['textarea', 'Paragraph'],
        ['email', 'Email'],
        ['number', 'Number'],
        ['select', 'Choice'],
        ['checkbox', 'Checkbox']
      ];
      const $ = (sel, root = document) => root.querySelector(sel);
      const esc = (value) =>
        String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
      const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

      try {
        document.documentElement.dataset.theme = window.parent.document.documentElement.dataset.theme || 'light';
      } catch {
        /* standalone */
      }

      let db = { forms: [] };
      let current = '';
      let query = '';
      let responses = [];
      let timer = null;

      async function api(path, { method = 'GET', body } = {}) {
        const init = { method, credentials: 'same-origin', headers: {} };
        if (body !== undefined) {
          init.headers['Content-Type'] = 'application/json';
          init.body = JSON.stringify(body);
        }
        const response = await fetch(path, init);
        let data = null;
        try {
          data = await response.json();
        } catch {
          data = null;
        }
        if (!response.ok) {
          const error = new Error(data?.error || `Request failed (${response.status})`);
          error.status = response.status;
          throw error;
        }
        return data || {};
      }

      function toast(message, bad = false) {
        const node = document.createElement('div');
        node.className = `toast${bad ? ' bad' : ''}`;
        node.textContent = message;
        $('#toast-root').appendChild(node);
        setTimeout(() => node.remove(), bad ? 6000 : 3000);
      }

      function token() {
        const bytes = crypto.getRandomValues(new Uint8Array(18));
        return btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }

      async function load() {
        try {
          const data = await api(`/api/apps/${APP}/storage`);
          const saved = JSON.parse(data.data?.state || '{}');
          db = { forms: Array.isArray(saved.forms) ? saved.forms : [] };
          if (!db.forms.some((form) => form.id === current)) current = db.forms[0]?.id || '';
          renderList();
          await renderPane();
        } catch (error) {
          if (error.status === 403) return renderConsent();
          toast(error.message, true);
        }
      }

      async function save(quiet = false) {
        await api(`/api/apps/${APP}/storage`, { method: 'PUT', body: { key: 'state', value: JSON.stringify(db) } });
        if (!quiet) toast('Form saved');
      }

      function renderConsent() {
        $('#pane').innerHTML = `<div class="card empty-state" style="margin:auto">
          <i class="fa-solid fa-shield-halved"></i>
          <p>Forms are stored in your CoolCloud account. Allow storage once to start.</p>
          <button class="btn primary sm" id="grant"><i class="fa-solid fa-check"></i> Allow storage</button>
        </div>`;
        $('#grant').addEventListener('click', async () => {
          try {
            await api(`/api/apps/${APP}/grants`, { method: 'POST', body: { scopes: ['storage'] } });
            await load();
          } catch (error) {
            toast(error.message, true);
          }
        });
      }

      function renderList() {
        const list = db.forms
          .filter((form) => !query || `${form.title} ${form.description}`.toLowerCase().includes(query))
          .sort((a, b) => String(b.updated || b.createdAt || '').localeCompare(String(a.updated || a.createdAt || '')));
        $('#list').innerHTML = list.length
          ? list
              .map(
                (form) => `<button class="row" data-form="${esc(form.id)}" aria-current="${String(form.id === current)}">
                  <b>${esc(form.title || 'Untitled form')}</b>
                  <span>${(form.fields || []).length} question${(form.fields || []).length === 1 ? '' : 's'} · ${esc(new Date(form.createdAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }))}</span>
                </button>`
              )
              .join('')
          : `<p class="hint" style="padding:8px">${query ? 'Nothing matches.' : 'No forms yet.'}</p>`;
        $('#list').querySelectorAll('[data-form]').forEach((node) =>
          node.addEventListener('click', async () => {
            current = node.dataset.form;
            renderList();
            await renderPane();
          })
        );
      }

      async function loadResponses(form) {
        responses = [];
        try {
          const data = await api(`/api/apps/${APP}/storage`);
          const saved = JSON.parse(data.data?.[`responses-${form.id}`] || '{}');
          responses = Array.isArray(saved.items) ? saved.items : [];
        } catch {
          responses = [];
        }
      }

      async function renderPane() {
        const form = db.forms.find((item) => item.id === current);
        if (!form) {
          $('#pane').innerHTML = `<div class="card empty-state" style="margin:auto"><i class="fa-solid fa-clipboard-list"></i><p>Build a form, share the public link, and collect answers without an account.</p><button class="btn primary sm" data-new>Create a form</button></div>`;
          $('#pane').querySelector('[data-new]').addEventListener('click', createForm);
          return;
        }
        await loadResponses(form);
        const url = `${location.origin}/f/${form.token}`;
        $('#pane').innerHTML = `
          <div class="head">
            <div><h1>${esc(form.title || 'Untitled form')}</h1><p>${responses.length} response${responses.length === 1 ? '' : 's'} · saved automatically</p></div>
            <div class="row" style="gap:6px">
              <a class="btn quiet sm" href="${esc(url)}" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-arrow-up-right-from-square"></i> Open</a>
              <button class="btn ghost sm" id="delete" aria-label="Delete form"><i class="fa-solid fa-trash-can"></i></button>
            </div>
          </div>

          <section class="card stack-3">
            <div class="field"><label class="label">Title</label><input class="input" data-form-field="title" value="${esc(form.title)}" /></div>
            <div class="field"><label class="label">Description</label><textarea class="input" data-form-field="description" rows="2">${esc(form.description || '')}</textarea></div>
            <div class="field"><label class="label">Public link</label>
              <div class="share"><input class="input" id="share-url" readonly value="${esc(url)}" /><button class="btn quiet sm" id="copy">Copy</button></div>
              <span class="hint">Anyone with the link can submit; no CoolCloud account needed.</span>
            </div>
          </section>

          <section class="card">
            <h2>Questions</h2>
            <div id="fields">${(form.fields || [])
              .map(
                (field, index) => `<div class="field-row-app" data-field="${esc(field.id)}">
                  <div class="line">
                    <span class="badge">${index + 1}</span>
                    <input class="input label-in" data-prop="label" value="${esc(field.label)}" placeholder="Question" aria-label="Question label" />
                    <select class="select type-in" data-prop="type" aria-label="Answer type">${TYPES.map(
                      ([value, label]) => `<option value="${value}" ${field.type === value ? 'selected' : ''}>${label}</option>`
                    ).join('')}</select>
                    <label class="row" style="gap:5px;align-items:center;font-size:11.5px"><input type="checkbox" data-prop="required" ${field.required ? 'checked' : ''} /> Required</label>
                    <button class="btn ghost icon sm" data-remove aria-label="Remove question"><i class="fa-solid fa-xmark"></i></button>
                  </div>
                  ${field.type === 'select' ? `<input class="input" data-prop="options" value="${esc((field.options || []).join(', '))}" placeholder="Option one, Option two" aria-label="Options" />` : ''}
                </div>`
              )
              .join('')}</div>
            <div class="add-row">
              ${TYPES.map(([value, label]) => `<button class="btn quiet sm" data-add="${value}"><i class="fa-solid fa-plus"></i> ${label}</button>`).join('')}
            </div>
          </section>

          <section class="card">
            <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:8px">
              <h2 style="margin:0">Responses (${responses.length})</h2>
              <div class="row" style="gap:6px">
                <button class="btn quiet sm" id="refresh"><i class="fa-solid fa-rotate"></i> Refresh</button>
                <button class="btn quiet sm" id="csv"><i class="fa-solid fa-file-csv"></i> Export</button>
              </div>
            </div>
            <div id="responses">${responses.length
              ? [...responses]
                  .reverse()
                  .slice(0, 12)
                  .map((entry) => {
                    const summary = (form.fields || [])
                      .slice(0, 3)
                      .map((field) => `${field.label}: ${entry.values?.[field.id] === true ? 'yes' : entry.values?.[field.id] === false ? 'no' : entry.values?.[field.id] || '—'}`)
                      .join(' · ');
                    return `<div class="resp"><b>${esc(new Date(entry.at).toLocaleString())}</b><span>${esc(summary || 'No answers')}</span></div>`;
                  })
                  .join('')
              : '<p class="hint" style="margin:0">No responses yet. Open the public link to try it.</p>'}</div>
          </section>`;

        const touch = () => {
          for (const input of $('#pane').querySelectorAll('[data-form-field]')) form[input.dataset.formField] = input.value;
          form.updated = new Date().toISOString();
          clearTimeout(timer);
          timer = setTimeout(() => {
            save(true).catch((error) => toast(error.message, true));
            renderList();
          }, 600);
        };
        $('#pane').querySelectorAll('[data-form-field]').forEach((input) => input.addEventListener('input', touch));
        $('#pane').querySelectorAll('[data-field]').forEach((row) =>
          row.querySelectorAll('[data-prop]').forEach((input) =>
            input.addEventListener('input', () => {
              const field = (form.fields || []).find((item) => item.id === row.dataset.field);
              if (!field) return;
              const prop = input.dataset.prop;
              if (prop === 'required') field.required = input.checked;
              else if (prop === 'options') field.options = input.value.split(',').map((value) => value.trim()).filter(Boolean);
              else if (prop === 'type') {
                field.type = input.value;
                save(true).then(() => renderPane());
                return;
              } else field[prop] = input.value;
              form.updated = new Date().toISOString();
              clearTimeout(timer);
              timer = setTimeout(() => save(true).catch((error) => toast(error.message, true)), 600);
            })
          )
        );
        $('#pane').querySelectorAll('[data-remove]').forEach((node) =>
          node.addEventListener('click', () => {
            const id = node.closest('[data-field]').dataset.field;
            form.fields = form.fields.filter((field) => field.id !== id);
            save(true).then(() => renderPane());
          })
        );
        $('#pane').querySelectorAll('[data-add]').forEach((node) =>
          node.addEventListener('click', () => {
            form.fields = form.fields || [];
            form.fields.push({ id: uid(), label: 'Question', type: node.dataset.add, required: false, options: node.dataset.add === 'select' ? ['Option one', 'Option two'] : [] });
            form.updated = new Date().toISOString();
            save(true).then(() => renderPane());
          })
        );
        $('#copy').addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(url);
            toast('Link copied');
          } catch {
            $('#share-url').select();
          }
        });
        $('#refresh').addEventListener('click', () => renderPane());
        $('#csv').addEventListener('click', () => {
          if (!responses.length) return toast('No responses to export', true);
          const cell = (value) => `"${String(value ?? '').replace(/"/g, '""')}"`;
          const rows = [['submitted at', ...(form.fields || []).map((field) => field.label)]];
          for (const entry of responses) {
            rows.push([
              entry.at,
              ...(form.fields || []).map((field) => {
                const value = entry.values?.[field.id];
                return value === true ? 'yes' : value === false ? 'no' : value || '';
              })
            ]);
          }
          const blob = new Blob(['\ufeff' + rows.map((row) => row.map(cell).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = `${(form.title || 'form').replace(/[^a-z0-9]+/gi, '-').toLowerCase()}-responses.csv`;
          link.click();
          setTimeout(() => URL.revokeObjectURL(link.href), 1000);
          toast('Responses exported');
        });
        $('#delete').addEventListener('click', async () => {
          if (!confirm(`Delete ${form.title || 'this form'}? The public link stops working.`)) return;
          db.forms = db.forms.filter((item) => item.id !== form.id);
          current = db.forms[0]?.id || '';
          await save(true);
          await api(`/api/apps/${APP}/storage`, { method: 'PUT', body: { key: `responses-${form.id}`, value: '{"items":[]}' } }).catch(() => {});
          renderList();
          await renderPane();
          toast('Form deleted');
        });
      }

      async function createForm() {
        const form = { id: uid(), token: token(), title: 'Untitled form', description: '', fields: [], createdAt: new Date().toISOString(), updated: new Date().toISOString() };
        db.forms.push(form);
        current = form.id;
        await save(true);
        renderList();
        await renderPane();
        $('#pane').querySelector('[data-form-field="title"]')?.select();
      }

      $('#new-form').addEventListener('click', createForm);
      $('#search').addEventListener('input', (event) => {
        query = event.target.value.trim().toLowerCase();
        renderList();
      });
      load();
    </script>
  </body>
</html>
