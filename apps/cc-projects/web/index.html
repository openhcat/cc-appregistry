<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Projects · CoolCloud</title>
    <link rel="stylesheet" href="/vendor/fa/css/all.min.css" />
    <link rel="stylesheet" href="/vendor/fonts/inter.css" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <style>
      body { background: var(--bg); }
      .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
      .rail { border-right: 1px solid var(--border); background: var(--surface); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
      .rail .brand { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 15px; }
      .rail .brand i { color: var(--app-projects, var(--accent)); }
      .proj { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 8px 9px; border-radius: 9px; color: var(--text-2); font: inherit; font-size: 12.5px; cursor: pointer; text-align: left; }
      .proj:hover { background: var(--surface-3); color: var(--text); }
      .proj[aria-current='true'] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
      .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
      .pane { padding: 22px 26px 40px; min-width: 0; }
      .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
      .head h1 { font-size: 21px; margin: 0; letter-spacing: -0.02em; }
      .head p { margin: 3px 0 0; color: var(--text-3); font-size: 12.5px; }
      .stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; color: var(--text-3); font-size: 12px; }
      .stats b { color: var(--text); }
      .board { display: grid; grid-template-columns: repeat(3, minmax(200px, 1fr)); gap: 12px; align-items: start; }
      .col { background: var(--surface-2); border: 1px solid var(--border); border-radius: 13px; padding: 11px; display: flex; flex-direction: column; gap: 8px; min-height: 150px; }
      .col h3 { margin: 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); display: flex; justify-content: space-between; }
      .task { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px; display: grid; gap: 4px; }
      .task b { font-size: 12.5px; font-weight: 600; }
      .task .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 11px; color: var(--text-3); }
      .task .move { margin-left: auto; display: flex; gap: 2px; }
      .task .move button { border: 0; background: none; color: var(--text-3); cursor: pointer; padding: 2px 4px; border-radius: 5px; }
      .task .move button:hover { background: var(--surface-3); color: var(--text); }
      .sheet { position: fixed; inset: 0; background: var(--overlay); display: grid; place-items: center; padding: 18px; z-index: 60; }
      .sheet-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; width: min(470px, 100%); box-shadow: 0 24px 70px rgba(9, 30, 52, 0.3); max-height: 90vh; overflow: auto; }
      .sheet-card h2 { margin: 0 0 3px; font-size: 16px; }
      .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
      .toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 90; }
      .toast { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--ok); border-radius: 10px; padding: 10px 13px; font-size: 12.5px; box-shadow: 0 10px 30px rgba(9, 30, 52, 0.16); }
      .toast.bad { border-left-color: var(--danger); }
      .empty-state { text-align: center; padding: 40px 10px; color: var(--text-3); }
      .empty-state i { font-size: 26px; display: block; margin-bottom: 10px; opacity: 0.6; }
      .empty-state p { margin: 0 0 12px; font-size: 13px; }
      @media (max-width: 820px) { .app { grid-template-columns: 1fr; } .rail { border-right: 0; border-bottom: 1px solid var(--border); } .board { grid-template-columns: 1fr; } .pane { padding: 18px; } }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="rail">
        <div class="brand"><i class="fa-solid fa-diagram-project"></i> Projects</div>
        <p class="hint" style="margin: 0">Boards for the work in flight, kept on your server.</p>
        <button class="btn primary sm" id="new-project"><i class="fa-solid fa-plus"></i> New project</button>
        <nav style="display: flex; flex-direction: column; gap: 3px" id="projects" aria-label="Projects"></nav>
        <span class="grow"></span>
        <p class="hint" style="margin: 0"><i class="fa-solid fa-lock"></i> Private to you</p>
      </aside>
      <main class="pane">
        <div class="head">
          <div>
            <h1 id="title">Projects</h1>
            <p id="subtitle">Pick a project, or start one.</p>
          </div>
          <button class="btn quiet sm" id="new-task"><i class="fa-solid fa-plus"></i> New task</button>
        </div>
        <div class="stats" id="stats"></div>
        <div id="view"></div>
      </main>
    </div>
    <div id="modal-root"></div>
    <div class="toasts" id="toast-root"></div>

    <script type="module">
      const APP = 'cc:projects';
      const COLUMNS = [
        ['todo', 'To do'],
        ['doing', 'In progress'],
        ['done', 'Done']
      ];
      const PRIORITIES = ['low', 'normal', 'high'];
      const COLORS = ['#2c6e8f', '#3c6ea5', '#40727f', '#55679b', '#2f7f95', '#62659a', '#8a6d3b'];
      const $ = (sel, root = document) => root.querySelector(sel);
      const esc = (value) =>
        String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
      const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      const today = () => new Date().toISOString().slice(0, 10);

      try {
        document.documentElement.dataset.theme = window.parent.document.documentElement.dataset.theme || 'light';
      } catch {
        /* standalone */
      }

      let db = { projects: [], tasks: [] };
      let current = '';

      async function api(path, { method = 'GET', body } = {}) {
        const init = { method, credentials: 'same-origin', headers: {} };
        if (body !== undefined) {
          init.headers['Content-Type'] = 'application/json';
          init.body = JSON.stringify(body);
        }
        const response = await fetch(path, init);
        let data = null;
        try {
          data = await response.json();
        } catch {
          data = null;
        }
        if (!response.ok) {
          const error = new Error(data?.error || `Request failed (${response.status})`);
          error.status = response.status;
          throw error;
        }
        return data || {};
      }

      function toast(message, bad = false) {
        const node = document.createElement('div');
        node.className = `toast${bad ? ' bad' : ''}`;
        node.textContent = message;
        $('#toast-root').appendChild(node);
        setTimeout(() => node.remove(), bad ? 6000 : 3000);
      }

      function sheet({ title, body, submit = 'Save', onSubmit, onMount }) {
        const wrap = document.createElement('div');
        wrap.className = 'sheet';
        wrap.innerHTML = `<form class="sheet-card">
          <h2>${esc(title)}</h2>
          <div style="margin-top:12px">${body}</div>
          <div class="actions">
            <button type="button" class="btn ghost" data-close>Cancel</button>
            <button type="submit" class="btn primary">${esc(submit)}</button>
          </div>
        </form>`;
        const close = () => wrap.remove();
        wrap.addEventListener('mousedown', (event) => {
          if (event.target === wrap) close();
        });
        wrap.querySelector('[data-close]').addEventListener('click', close);
        wrap.querySelector('form').addEventListener('submit', async (event) => {
          event.preventDefault();
          const button = wrap.querySelector('button[type="submit"]');
          button.disabled = true;
          try {
            await onSubmit(wrap);
            close();
          } catch (error) {
            toast(error.message, true);
            button.disabled = false;
          }
        });
        $('#modal-root').appendChild(wrap);
        onMount?.(wrap);
        setTimeout(() => wrap.querySelector('input, textarea, select')?.focus(), 30);
      }

      async function load() {
        try {
          const data = await api(`/api/apps/${APP}/storage`);
          const saved = JSON.parse(data.data?.state || '{}');
          db = { projects: Array.isArray(saved.projects) ? saved.projects : [], tasks: Array.isArray(saved.tasks) ? saved.tasks : [] };
          if (!db.projects.some((project) => project.id === current)) current = db.projects[0]?.id || '';
          render();
        } catch (error) {
          if (error.status === 403) return renderConsent();
          toast(error.message, true);
        }
      }

      async function save() {
        await api(`/api/apps/${APP}/storage`, { method: 'PUT', body: { key: 'state', value: JSON.stringify(db) } });
      }

      function renderConsent() {
        $('#view').innerHTML = `<div class="card empty-state">
          <i class="fa-solid fa-shield-halved"></i>
          <p>Projects keeps its boards in your CoolCloud account. Allow storage once to start.</p>
          <button class="btn primary sm" id="grant"><i class="fa-solid fa-check"></i> Allow storage</button>
        </div>`;
        $('#grant').addEventListener('click', async () => {
          try {
            await api(`/api/apps/${APP}/grants`, { method: 'POST', body: { scopes: ['storage'] } });
            await load();
          } catch (error) {
            toast(error.message, true);
          }
        });
      }

      function render() {
        $('#projects').innerHTML = db.projects
          .map(
            (project) => `<button class="proj" data-project="${esc(project.id)}" aria-current="${String(project.id === current)}">
              <span class="dot" style="background:${esc(project.color || COLORS[0])}"></span>
              <span class="grow truncate">${esc(project.name)}</span>
              <span class="tiny dim">${db.tasks.filter((task) => task.project === project.id && task.status !== 'done').length}</span>
            </button>`
          )
          .join('');
        $('#projects').querySelectorAll('[data-project]').forEach((node) =>
          node.addEventListener('click', () => {
            current = node.dataset.project;
            render();
          })
        );

        const project = db.projects.find((item) => item.id === current);
        $('#title').textContent = project ? project.name : 'Projects';
        $('#subtitle').textContent = project ? 'Board, owners and due dates.' : 'Pick a project, or start one.';
        $('#new-task').disabled = !project;

        if (!project) {
          $('#stats').innerHTML = '';
          $('#view').innerHTML = `<div class="card empty-state"><i class="fa-solid fa-diagram-project"></i><p>No projects yet. Create one and add the first task.</p><button class="btn primary sm" data-new-project>New project</button></div>`;
          $('#view').querySelector('[data-new-project]').addEventListener('click', () => projectForm());
          return;
        }

        const tasks = db.tasks.filter((task) => task.project === project.id);
        const done = tasks.filter((task) => task.status === 'done').length;
        const late = tasks.filter((task) => task.status !== 'done' && task.due && task.due < today()).length;
        $('#stats').innerHTML = `<span><b>${tasks.length}</b> tasks</span><span><b>${done}</b> done</span><span><b>${tasks.length ? Math.round((done / tasks.length) * 100) : 0}%</b> complete</span><span><b>${late}</b> overdue</span>`;

        $('#view').innerHTML = `<div class="board">${COLUMNS.map(([key, label]) => {
          const column = tasks.filter((task) => (task.status || 'todo') === key);
          return `<section class="col"><h3><span>${label}</span><span>${column.length}</span></h3>
            ${column
              .map(
                (task) => `<article class="task">
                  <div class="row" style="gap:6px;align-items:flex-start"><b class="grow">${esc(task.title)}</b>
                    <span class="move">
                      ${key !== 'todo' ? `<button data-move="${esc(task.id)}" data-to="${key === 'done' ? 'doing' : 'todo'}" aria-label="Move back"><i class="fa-solid fa-arrow-left"></i></button>` : ''}
                      ${key !== 'done' ? `<button data-move="${esc(task.id)}" data-to="${key === 'todo' ? 'doing' : 'done'}" aria-label="Move forward"><i class="fa-solid fa-arrow-right"></i></button>` : ''}
                    </span>
                  </div>
                  <div class="meta">
                    ${task.priority === 'high' ? '<span class="badge danger">high</span>' : task.priority === 'low' ? '<span class="badge">low</span>' : ''}
                    ${task.owner ? `<span><i class="fa-regular fa-user"></i> ${esc(task.owner)}</span>` : ''}
                    ${task.due ? `<span style="${task.status !== 'done' && task.due < today() ? 'color:var(--danger)' : ''}"><i class="fa-regular fa-calendar"></i> ${esc(task.due)}</span>` : ''}
                    <button class="btn ghost icon sm" data-edit-task="${esc(task.id)}" aria-label="Edit task" style="margin-left:auto"><i class="fa-solid fa-pen"></i></button>
                  </div>
                </article>`
              )
              .join('')}
            ${column.length ? '' : '<p class="tiny dim" style="margin:2px">Empty.</p>'}
          </section>`;
        }).join('')}</div>`;

        $('#view').querySelectorAll('[data-move]').forEach((node) =>
          node.addEventListener('click', async () => {
            const task = db.tasks.find((item) => item.id === node.dataset.move);
            if (!task) return;
            task.status = node.dataset.to;
            await save();
            render();
          })
        );
        $('#view').querySelectorAll('[data-edit-task]').forEach((node) =>
          node.addEventListener('click', () => taskForm(node.dataset.editTask))
        );
      }

      function projectForm() {
        sheet({
          title: 'New project',
          body: `<div class="stack-3">
            <div class="field"><label class="label">Name</label><input class="input" name="name" required placeholder="Website relaunch" /></div>
            <div class="field"><label class="label">Colour</label><div class="row wrap" style="gap:8px">${COLORS.map(
              (color, index) => `<label class="row" style="gap:6px"><input type="radio" name="color" value="${color}" ${index === 0 ? 'checked' : ''} /><span class="dot" style="background:${color}"></span></label>`
            ).join('')}</div></div>
          </div>`,
          onSubmit: async (wrap) => {
            const data = Object.fromEntries(new FormData(wrap.querySelector('form')).entries());
            if (!String(data.name).trim()) throw new Error('A project needs a name');
            const project = { id: uid(), name: String(data.name).trim(), color: data.color || COLORS[0] };
            db.projects.push(project);
            current = project.id;
            await save();
            render();
            toast('Project created');
          }
        });
      }

      function taskForm(id) {
        const task = db.tasks.find((item) => item.id === id) || { status: 'todo', priority: 'normal', project: current };
        sheet({
          title: id ? 'Edit task' : 'New task',
          body: `<div class="stack-3">
            <div class="field"><label class="label">Task</label><input class="input" name="title" required value="${esc(task.title || '')}" /></div>
            <div class="field-row"><div class="field"><label class="label">Owner</label><input class="input" name="owner" placeholder="Who" value="${esc(task.owner || '')}" /></div>
            <div class="field"><label class="label">Due</label><input class="input" type="date" name="due" value="${esc(task.due || '')}" /></div></div>
            <div class="field-row"><div class="field"><label class="label">Column</label><select class="select" name="status">${COLUMNS.map(
              ([key, label]) => `<option value="${key}" ${task.status === key ? 'selected' : ''}>${label}</option>`
            ).join('')}</select></div>
            <div class="field"><label class="label">Priority</label><select class="select" name="priority">${PRIORITIES.map(
              (priority) => `<option value="${priority}" ${task.priority === priority ? 'selected' : ''}>${priority}</option>`
            ).join('')}</select></div></div>
          </div>
          ${id ? '<div style="margin-top:12px"><button type="button" class="btn danger sm" data-delete>Delete task</button></div>' : ''}`,
          onSubmit: async (wrap) => {
            const data = Object.fromEntries(new FormData(wrap.querySelector('form')).entries());
            if (!String(data.title).trim()) throw new Error('A task needs a title');
            if (id) Object.assign(task, data);
            else db.tasks.push({ id: uid(), project: current, ...data });
            await save();
            render();
            toast(id ? 'Task updated' : 'Task added');
          },
          onMount: (wrap) => {
            wrap.querySelector('[data-delete]')?.addEventListener('click', async () => {
              if (!confirm('Delete this task?')) return;
              db.tasks = db.tasks.filter((item) => item.id !== id);
              await save();
              wrap.remove();
              render();
              toast('Task deleted');
            });
          }
        });
      }

      $('#new-project').addEventListener('click', () => projectForm());
      $('#new-task').addEventListener('click', () => taskForm());
      load();
    </script>
  </body>
</html>
